monitor:
  default_interval_minutes: 5
  request_timeout_seconds: 20
  concurrency_limit: 5
  max_retries: 3
  user_agent: "LoungeflyMonitor/0.1 (+self-hosted product availability monitor)"

database:
  path: data/loungefly.db

logging:
  level: INFO
  path: logs/loungefly-monitor.log
  max_bytes: 5242880
  backup_count: 3

notifications:
  discord:
    enabled: false
  sms:
    enabled: false

retailers:
  geekcore:
    enabled: true
    interval_minutes: 5
  truffleshuffle:
    enabled: true
    interval_minutes: 10
  # HMV currently returns a Cloudflare managed challenge to normal HTTP
  # clients, including its search and sitemap endpoints. Keep it explicitly
  # disabled rather than treating challenge pages as product or stock data.
  hmv:
    enabled: false
    interval_minutes: 10
    status: REQUIRES_BROWSER
