monitor:
  default_interval_minutes: 5
  request_timeout_seconds: 20
  concurrency_limit: 5
  max_retries: 3
  user_agent: "LoungeflyMonitor/0.1 (+self-hosted product availability monitor)"
  missing_scan_threshold: 3
  failure_alert_threshold: 5
  retry_backoff_seconds: 1
  rate_limit_requests_per_second: 5
  retailer_job_timeout_seconds: 120

price_alerts:
  enabled: true
  minimum_drop_percent: 10
  minimum_drop_value: 5

release_alerts:
  enabled: true
  reminders: [24h, 1h]
  # Existing products are silently enriched on their first release-aware scan.
  notify_existing_on_upgrade: false

database:
  path: data/loungefly.db

logging:
  level: INFO
  path: logs/loungefly-monitor.log
  max_bytes: 5242880
  backup_count: 3

notifications:
  discord:
    enabled: false
  sms:
    enabled: false

retailers:
  # High-priority UK discovery source. Complete Shopify Backpacks and Disney Parks
  # feeds are deduplicated by product ID; detail pages remain targeted checks.
  disney_mad_uk:
    enabled: true
    interval_minutes: 10
    status: WORKING
  damaged_society_uk:
    enabled: true
    interval_minutes: 10
    status: WORKING
  koolaz_uk:
    enabled: true
    interval_minutes: 10
    status: WORKING
  cool_merch_uk:
    enabled: true
    interval_minutes: 10
    status: WORKING
  lf_lovers:
    enabled: true
    interval_minutes: 10
    status: WORKING
  cm_pop_uk:
    enabled: true
    interval_minutes: 10
    status: WORKING
  geek_garage_uk:
    enabled: true
    interval_minutes: 10
    status: WORKING
  # Public Shopify Loungefly collection; the feed is directly accessible without a browser.
  razmatazz_uk:
    enabled: true
    interval_minutes: 10
    status: WORKING
  # Public WooCommerce Store API, scoped to the retailer's Loungefly backpack category.
  get_ready_comics_uk:
    enabled: true
    interval_minutes: 15
    status: WORKING
  geekcore:
    enabled: true
    interval_minutes: 5
  truffleshuffle:
    enabled: true
    interval_minutes: 10
  loungefly_uk:
    enabled: true
    interval_minutes: 10
    status: WORKING
  loungefly_us:
    enabled: true
    interval_minutes: 10
    status: WORKING
  loungefly_canada:
    enabled: true
    interval_minutes: 10
    status: WORKING
  disney_store_uk:
    enabled: true
    interval_minutes: 10
    status: WORKING
  disney_store_us:
    enabled: true
    interval_minutes: 10
    status: WORKING
  boxlunch:
    enabled: true
    interval_minutes: 15
    status: WORKING
  hot_topic_us:
    enabled: true
    interval_minutes: 15
    status: WORKING
  entertainment_earth:
    enabled: true
    interval_minutes: 15
    status: WORKING
  modern_pinup:
    enabled: true
    interval_minutes: 10
    status: WORKING
  # Public Shopify collections provide overlapping merchandising and availability signals.
  circle_of_hope:
    enabled: true
    interval_minutes: 10
    status: WORKING
  # Dedicated mini-backpack catalogue pages provide frequent, low-cost state checks;
  # individual detail pages are reserved for targeted checks.
  merchoid_uk:
    enabled: true
    interval_minutes: 10
    status: WORKING
  # Structured search is restricted to the Loungefly brand and Mini Backpack query.
  magic_madhouse_uk:
    enabled: true
    interval_minutes: 10
    status: WORKING
  pink_a_la_mode:
    enabled: true
    interval_minutes: 10
    status: WORKING
  street_707:
    enabled: true
    interval_minutes: 10
    status: WORKING
  cordys_corner:
    enabled: true
    interval_minutes: 10
    status: WORKING
  infinity_collectables:
    enabled: true
    interval_minutes: 10
    status: WORKING
  something_different_uk:
    enabled: true
    interval_minutes: 10
    status: WORKING
  forbidden_planet_uk:
    enabled: true
    interval_minutes: 10
    status: WORKING
  popcultcha:
    enabled: true
    interval_minutes: 10
    status: WORKING
  # Public Shopify collection provides complete catalogue scans; a small rotating
  # detail batch enriches changed products with barcode and exact inventory data.
  ozzie_collectables:
    enabled: true
    interval_minutes: 15
    detail_batch_size: 20
    status: WORKING
  # Public Shopify feeds provide a complete, deduplicated Loungefly bag scan in
  # three requests; individual product.js is reserved for targeted checks.
  pop_pelican:
    enabled: true
    interval_minutes: 15
    status: WORKING
  # Large public Shopify Loungefly catalogue. Overlapping collection feeds are
  # merged by Shopify product ID and ordinary HTTP retry/backoff handles rate limits.
  world_1_1_games:
    enabled: true
    interval_minutes: 10
    status: WORKING
  # Full public bag collections are reconciled; the large newest-first shop-all
  # collection is sampled as a lightweight discovery lane and deduplicated by ID.
  gwens_mermaid_cove:
    enabled: true
    interval_minutes: 15
    status: WORKING
  # Public Shopify feeds reconcile all bag and Vault collections. The homepage's
  # small curated New Arrivals lane is checked each pass and deduplicated by product ID.
  bag_dude:
    enabled: true
    interval_minutes: 10
    status: WORKING
  # Collector-focused Shopify catalogue plus a product-specific incoming D23 article.
  amy_david_magic:
    enabled: true
    interval_minutes: 10
    incoming_interval_minutes: 10
    reconciliation_interval_minutes: 30
    high_priority_interval_minutes: 5
    status: WORKING
  # EMP and Large.nl share one configurable Salesforce Commerce Cloud adapter,
  # but run as independent jobs and retain independent health state.
  emp_de:
    enabled: true
    interval_minutes: 10
    status: WORKING
  emp_fr:
    enabled: true
    interval_minutes: 10
    status: WORKING
  emp_es:
    enabled: true
    interval_minutes: 10
    status: WORKING
  emp_it:
    enabled: true
    interval_minutes: 10
    status: WORKING
  large_nl:
    enabled: true
    interval_minutes: 10
    status: WORKING
