monitor:
  default_interval_minutes: 5
  request_timeout_seconds: 20
  concurrency_limit: 5
  max_retries: 3
  user_agent: "LoungeflyMonitor/0.1 (+self-hosted product availability monitor)"
  missing_scan_threshold: 3
  failure_alert_threshold: 5
  retry_backoff_seconds: 1
  rate_limit_requests_per_second: 5
  retailer_job_timeout_seconds: 120

price_alerts:
  enabled: true
  minimum_drop_percent: 10
  minimum_drop_value: 5

release_alerts:
  enabled: true
  reminders: [24h, 1h]
  # Existing products are silently enriched on their first release-aware scan.
  notify_existing_on_upgrade: false

database:
  path: data/loungefly.db

logging:
  level: INFO
  path: logs/loungefly-monitor.log
  max_bytes: 5242880
  backup_count: 3

notifications:
  discord:
    enabled: false
  sms:
    enabled: false

retailers:
  geekcore:
    enabled: true
    interval_minutes: 5
  truffleshuffle:
    enabled: true
    interval_minutes: 10
  loungefly_uk:
    enabled: true
    interval_minutes: 10
    status: WORKING
  loungefly_us:
    enabled: true
    interval_minutes: 10
    status: WORKING
  loungefly_canada:
    enabled: true
    interval_minutes: 10
    status: WORKING
  disney_store_uk:
    enabled: true
    interval_minutes: 10
    status: WORKING
  disney_store_us:
    enabled: true
    interval_minutes: 10
    status: WORKING
  boxlunch:
    enabled: true
    interval_minutes: 15
    status: WORKING
  hot_topic_us:
    enabled: true
    interval_minutes: 15
    status: WORKING
  entertainment_earth:
    enabled: true
    interval_minutes: 15
    status: WORKING
