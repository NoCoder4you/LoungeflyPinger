monitor:
  default_interval_minutes: 5
  request_timeout_seconds: 20
  concurrency_limit: 5
  max_retries: 3
  user_agent: "LoungeflyMonitor/0.1 (+self-hosted product availability monitor)"

database:
  path: data/loungefly.db

logging:
  level: INFO
  path: logs/loungefly-monitor.log
  max_bytes: 5242880
  backup_count: 3

notifications:
  discord:
    enabled: false
  sms:
    enabled: false

# Playwright is started lazily and only when an enabled browser retailer needs it.
browser:
  enabled: true
  max_concurrent_pages: 1
  navigation_timeout_seconds: 30

retailers:
  geekcore:
    enabled: true
    interval_minutes: 5
  truffleshuffle:
    enabled: true
    interval_minutes: 10
  loungefly_uk:
    enabled: true
    interval_minutes: 10
    status: WORKING
  # Controlled ordinary-Playwright verification (2026-09-08) still received
  # Cloudflare's managed challenge. Do not enable unattended monitoring.
  hmv:
    enabled: false
    transport: browser
    interval_minutes: 15
    status: REQUIRES_BROWSER_CHALLENGE
