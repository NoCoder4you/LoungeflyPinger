monitor:
  default_interval_minutes: 5
  request_timeout_seconds: 20
  concurrency_limit: 5
  max_retries: 3
  user_agent: "LoungeflyMonitor/0.1 (+self-hosted product availability monitor)"
  missing_scan_threshold: 3

price_alerts:
  enabled: true
  minimum_drop_percent: 10
  minimum_drop_value: 5

database:
  path: data/loungefly.db

logging:
  level: INFO
  path: logs/loungefly-monitor.log
  max_bytes: 5242880
  backup_count: 3

notifications:
  discord:
    enabled: false
  sms:
    enabled: false

retailers:
  geekcore:
    enabled: true
    interval_minutes: 5
  truffleshuffle:
    enabled: true
    interval_minutes: 10
  loungefly_uk:
    enabled: true
    interval_minutes: 10
    status: WORKING
  disney_store_uk:
    enabled: true
    interval_minutes: 10
    status: WORKING
